- name: configuring frontend server
  hosts: frontend
  become: yes
  vars:

  tasks: #list of tasks/collections/modules
  - name: installing nginx
    ansible.builtin.dnf:
      name: nginx
      state: installed
  
  - name: start and enable nginx
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes

  - name: deleting files in html directory
    ansible.builtin.file:
      path: /usr/share/nginx/html/*
      state: absent
