- name: configuring backend server
  hosts: backend
  become: yes
  vars:

  tasks: #list of tasks/collections/modules
  - name: disabiling nodejs 18 version
    ansible.builtin.command: dnf module disable nodejs:18 -y

  - name: enabiling nodejs 20 version
    ansible.builtin.command: dnf module enable nodejs:20 -y
  
  - name: installing nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: installed

  - name: create expense user
    ansible.builtin.user:
      name: expense

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: downloading backend.zip file
    ansible.builtin.get_url:
      url: https://expense-builds.s3.us-east-1.amazonaws.com/expense-backend-v2.zip
      dest: /tmp/backend.zip
  
  - name: unzipping backend.zip file
    ansible.builtin.unarchive:
      src: /tmp/backend.zip
      dest: /app